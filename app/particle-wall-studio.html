<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>粒子墙工作台</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --line:#262b33;
    --text:#e6e9ee; --muted:#8b95a4; --accent:#4ea1ff; --warn:#ffb454; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  .layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 55px)}
  aside{padding:16px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  main{overflow:auto;padding:20px;min-width:0}
  #stage{display:flex;align-items:center;justify-content:center;min-height:100%}
  canvas{background:#000;border-radius:4px;max-width:100%;
         box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.6);image-rendering:pixelated}
  .block{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
  .block:last-of-type{border-bottom:0}
  label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  label b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=text],input[type=file]{width:100%;background:#0b0d10;border:1px solid var(--line);
       border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px}
  button{padding:8px 12px;border-radius:6px;cursor:pointer;
       border:1px solid var(--line);background:#1c2027;color:var(--text);font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
  button.wide{width:100%}
  .row{display:flex;gap:8px;margin-top:6px}
  .row input{flex:1}
  .row button{width:96px;flex:none}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
        padding:4px 0;border-bottom:1px dashed var(--line)}
  .stat b{color:var(--text);font-variant-numeric:tabular-nums}
  .hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px;word-break:break-all}
  .hint.ok{color:var(--ok)}
  .hint.warn{color:var(--warn)}
  .actions{display:grid;gap:10px;margin-top:18px}
  .actions button{padding:11px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>粒子墙工作台</h1>
  <span class="sub">图片 → 点阵预览 → 数据包</span>
</header>

<div class="layout">
  <aside>

    <div class="block">
      <label>存档位置（保存图片用）</label>
      <input type="text" id="worldPath" placeholder="D:\games\PCL\.minecraft\saves\新的世界">
      <div class="row">
        <button id="btnPickDir" style="width:auto;flex:1">选择 particleImages 文件夹</button>
      </div>
      <div class="hint" id="dirStatus">未授权</div>
    </div>

    <div class="block">
      <label>图片</label>
      <input type="file" id="file" accept="image/*">
    </div>

    <div class="block">
      <label>图片文件名 <b id="vName">0.png</b></label>
      <div class="row">
        <input type="text" id="fname" value="0.png">
        <button id="btnNext">下一个 +1</button>
      </div>
      <button class="wide" id="btnSaveImg" style="margin-top:8px">保存图片到已授权文件夹</button>
      <div class="hint" id="nameHint"></div>
    </div>

    <div class="block">
      <label>亮度 <b id="vBright">1.00</b></label>
      <input type="range" id="bright" min="0.2" max="2" step="0.05" value="1">

      <label style="margin-top:10px">清晰度（横向点数） <b id="vGrid">411</b></label>
      <input type="range" id="grid" min="32" max="640" step="8" value="411">

      <label style="margin-top:10px">疏密（每格粒子数） <b id="vDpb">16</b></label>
      <input type="range" id="dpb" min="2" max="32" step="1" value="16">

      <label style="margin-top:10px">放大预览 <b id="vZoom">1.0×</b></label>
      <input type="range" id="zoom" min="1" max="12" step="0.5" value="1">
    </div>

    <div class="stat"><span>网格</span><b id="sGrid">—</b></div>
    <div class="stat"><span>粒子数</span><b id="sCount">—</b></div>
    <div class="stat"><span>墙宽</span><b id="sWall">—</b></div>

    <div class="actions">
      <button class="primary" id="btnCmd">复制指令</button>
      <button class="primary" id="btnZip">下载数据包</button>
    </div>
  </aside>

  <main><div id="stage"><canvas id="cv" width="960" height="540"></canvas></div></main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');

  const state = { bright: 1, grid: 411, dpb: 16, zoom: 1, name: '0.png', worldPath: '' };
  let img = null, currentFile = null;
  let gridW = 0, gridH = 0, cellColors = null;
  let dirHandle = null;

  // ---------------------------------------------------------------- 持久化
  function saveSettings() {
    try {
      localStorage.setItem('pws', JSON.stringify({
        bright: state.bright, grid: state.grid, dpb: state.dpb,
        name: state.name, worldPath: state.worldPath
      }));
    } catch (e) {}
  }
  function loadSettings() {
    try { Object.assign(state, JSON.parse(localStorage.getItem('pws') || '{}')); } catch (e) {}
  }

  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('pws-db', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async set(k, v) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, k);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    },
    async get(k) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', 'readonly');
        const q = t.objectStore('kv').get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    }
  };

  // ---------------------------------------------------------------- 目录授权
  function setDirStatus(text, cls) {
    const el = $('dirStatus');
    el.textContent = text;
    el.className = 'hint' + (cls ? ' ' + cls : '');
  }

  async function pickDir() {
    if (!window.showDirectoryPicker) {
      setDirStatus('浏览器不支持直接写文件夹，请手动把图片复制进 particleImages', 'warn');
      return;
    }
    try {
      const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'pws-dir' });
      dirHandle = h;
      await idb.set('dir', h);
      setDirStatus('已授权：' + h.name + '（保存图片会直接写进去）', 'ok');
    } catch (e) {
      setDirStatus('未授权：' + e.message, 'warn');
    }
  }

  async function restoreDir() {
    try {
      const h = await idb.get('dir');
      if (!h) return;
      dirHandle = h;
      if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
        setDirStatus('已记住：' + h.name, 'ok');
      } else {
        setDirStatus('已记住 ' + h.name + '，保存时会请求权限', '');
      }
    } catch (e) {}
  }

  async function saveImage() {
    if (!currentFile) return alert('先在「图片」里选一张');
    if (!dirHandle) return alert('先点「选择 particleImages 文件夹」授权一次');
    try {
      let perm = await dirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await dirHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return alert('没有写入权限');

      const name = state.name;
      let exists = false;
      try { await dirHandle.getFileHandle(name); exists = true; } catch (e) { exists = false; }
      if (exists && !confirm(name + ' 已存在，覆盖吗？')) return;

      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(currentFile);
      await w.close();
      $('btnSaveImg').textContent = '已写入 ' + name + ' ✓';
      setTimeout(() => $('btnSaveImg').textContent = '保存图片到已授权文件夹', 3000);
    } catch (e) {
      alert('写入失败：' + e.message);
    }
  }

  // ---------------------------------------------------------------- 图片
  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    currentFile = f;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => { img = im; sample(); render(); updateStats(); URL.revokeObjectURL(url); };
    im.src = url;
  });

  function sample() {
    if (!img) return;
    gridW = state.grid;
    gridH = Math.max(1, Math.round(gridW * img.height / img.width));

    const W = 960;
    const H = Math.max(1, Math.round(W * img.height / img.width));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    applyZoom();

    const off = document.createElement('canvas');
    off.width = gridW; off.height = gridH;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'high';
    octx.fillStyle = '#000'; octx.fillRect(0, 0, gridW, gridH);
    octx.drawImage(img, 0, 0, gridW, gridH);
    cellColors = octx.getImageData(0, 0, gridW, gridH).data;
  }

  // ---------------------------------------------------------------- 渲染
  function render() {
    const W = cv.width, H = cv.height;
    const out = ctx.createImageData(W, H);
    const px = out.data;
    px.fill(0);
    for (let i = 3; i < px.length; i += 4) px[i] = 255;
    if (!cellColors) { ctx.putImageData(out, 0, 0); return; }

    const cw = W / gridW, ch = H / gridH;
    const ratio = Math.min(1.9, 0.1 * state.dpb);
    const dotW = cw * ratio, dotH = ch * ratio;
    const b = state.bright;

    for (let y = 0; y < H; y++) {
      const gy = Math.floor(y / ch); if (gy >= gridH) continue;
      const v = (y - gy * ch - ch / 2) / (dotH / 2);
      for (let x = 0; x < W; x++) {
        const gx = Math.floor(x / cw); if (gx >= gridW) continue;
        const u = (x - gx * cw - cw / 2) / (dotW / 2);
        const d = Math.abs(u) + Math.abs(v);
        if (d > 1) continue;
        const a = Math.min(1, (1 - d) * 3.2);
        if (a <= 0) continue;
        const si = (gy * gridW + gx) * 4, o = (y * W + x) * 4;
        px[o]     = Math.min(255, cellColors[si]     * b * a);
        px[o + 1] = Math.min(255, cellColors[si + 1] * b * a);
        px[o + 2] = Math.min(255, cellColors[si + 2] * b * a);
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  function applyZoom() {
    cv.style.maxWidth = 'none';
    cv.style.width = (cv.width * state.zoom) + 'px';
    cv.style.height = (cv.height * state.zoom) + 'px';
  }
  function setZoom(z) {
    state.zoom = Math.min(12, Math.max(1, z));
    $('zoom').value = state.zoom;
    $('vZoom').textContent = state.zoom.toFixed(1) + '×';
    applyZoom();
  }

  function updateStats() {
    $('sGrid').textContent = cellColors ? gridW + ' × ' + gridH : '—';
    $('sCount').textContent = cellColors ? (gridW * gridH).toLocaleString() : '—';
    $('sWall').textContent = cellColors ? (gridW / state.dpb).toFixed(1) + ' 格' : '—';
  }

  // ---------------------------------------------------------------- 文件名
  function bumpName() {
    const m = /^(\d+)(\.[A-Za-z0-9]+)$/.exec(state.name);
    const n = m ? parseInt(m[1], 10) + 1 : 0;
    state.name = n + (m ? m[2] : '.png');
    $('fname').value = state.name;
    $('vName').textContent = state.name;
    nameHint(); saveSettings();
  }

  function nameHint() {
    const el = $('nameHint');
    if (!state.name) { el.textContent = ''; return; }
    if (/[^\x20-\x7E]/.test(state.name)) {
      el.className = 'hint warn';
      el.textContent = '⚠ 含中文，建议用纯数字名（如 0.png）';
    } else {
      el.className = 'hint';
      el.textContent = '必须和 particleImages 里真实文件同名';
    }
  }

  // ---------------------------------------------------------------- 命令
  function geometry() {
    const wallW = gridW / state.dpb, wallH = gridH / state.dpb;
    return {
      hx: Math.ceil(wallW / 2) + 2,
      hy: Math.ceil(wallH / 2) + 2,
      dist: Math.max(18, Math.ceil(wallW * 0.7)),
      scaling: (gridW / (img ? img.width : gridW)).toFixed(3)
    };
  }

  function fullScript() {
    const g = geometry();
    return [
      '/particleex clearparticle',
      '/fill ~-' + g.hx + ' ~-' + g.hy + ' ~-' + (g.dist + 1) + ' ~' + g.hx + ' ~' + g.hy + ' ~-' + (g.dist + 1) + ' minecraft:light',
      '/particleex image minecraft:glow ~ ~2 ~-' + g.dist + ' ' + state.name + ' ' + g.scaling + ' 0 0 0 not ' + state.dpb + ' 0 0 0 -1'
    ].join('\n');
  }

  $('btnCmd').addEventListener('click', async () => {
    if (!img) return alert('先选一张图片');
    const txt = fullScript();
    try {
      await navigator.clipboard.writeText(txt);
      $('btnCmd').textContent = '已复制 3 条 ✓';
    } catch (e) { prompt('手动复制：', txt); }
    setTimeout(() => $('btnCmd').textContent = '复制指令', 2000);
  });

  // ---------------------------------------------------------------- ZIP
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const u16 = n => new Uint8Array([n & 255, (n >> 8) & 255]);
  const u32 = n => new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
  function concat(arrs) {
    let n = 0; for (const a of arrs) n += a.length;
    const out = new Uint8Array(n); let p = 0;
    for (const a of arrs) { out.set(a, p); p += a.length; }
    return out;
  }
  function zipStore(files) {
    const enc = new TextEncoder();
    const chunks = [], central = [];
    let offset = 0;
    for (const f of files) {
      const nb = enc.encode(f.name);
      const crc = crc32(f.data);
      const local = concat([u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length), u16(nb.length), u16(0), nb, f.data]);
      chunks.push(local);
      central.push(concat([u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nb.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), nb]));
      offset += local.length;
    }
    const cd = concat(central);
    return concat(chunks.concat([cd, concat([u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length), u32(cd.length), u32(offset), u16(0)])]));
  }

  $('btnZip').addEventListener('click', () => {
    if (!img) return alert('先选一张图片');
    const enc = new TextEncoder();
    const meta = JSON.stringify({
      pack: { pack_format: 48, description: 'particle wall: ' + state.name,
              supported_formats: { min_inclusive: 48, max_inclusive: 99 } }
    }, null, 2);
    // 函数文件里绝对不能带前导斜杠 —— 1.21 会判定整个函数加载失败
    const body = fullScript().split('\n').map(l => l.replace(/^\s*\//, '')).join('\n') + '\n';
    const files = [
      { name: 'pack.mcmeta', data: enc.encode(meta) },
      { name: 'data/vid/function/wall.mcfunction', data: enc.encode(body) }
    ];
    const blob = new Blob([zipStore(files)], { type: 'application/zip' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'particle-wall-datapack.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    setTimeout(() => alert('数据包已下载。\n\n放进 存档\\datapacks\\ → /reload → /function vid:wall'), 300);
  });

  // ---------------------------------------------------------------- 绑定
  $('bright').addEventListener('input', e => {
    state.bright = parseFloat(e.target.value);
    $('vBright').textContent = state.bright.toFixed(2);
    render(); saveSettings();
  });
  $('grid').addEventListener('input', e => {
    state.grid = parseInt(e.target.value, 10);
    $('vGrid').textContent = state.grid;
    if (img) sample();
    render(); updateStats(); saveSettings();
  });
  $('dpb').addEventListener('input', e => {
    state.dpb = parseInt(e.target.value, 10);
    $('vDpb').textContent = state.dpb;
    render(); updateStats(); saveSettings();
  });
  $('zoom').addEventListener('input', e => { setZoom(parseFloat(e.target.value)); saveSettings(); });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(state.zoom + (e.deltaY < 0 ? 0.5 : -0.5));
    saveSettings();
  }, { passive: false });

  $('fname').addEventListener('input', e => {
    state.name = e.target.value || '0.png';
    $('vName').textContent = state.name;
    nameHint(); saveSettings();
  });
  $('btnNext').addEventListener('click', bumpName);
  $('worldPath').addEventListener('input', e => { state.worldPath = e.target.value; saveSettings(); });
  $('btnPickDir').addEventListener('click', pickDir);
  $('btnSaveImg').addEventListener('click', saveImage);

  // ---------------------------------------------------------------- 启动
  loadSettings();
  $('bright').value = state.bright;
  $('vBright').textContent = parseFloat(state.bright).toFixed(2);
  $('grid').value = state.grid;
  $('vGrid').textContent = state.grid;
  $('dpb').value = state.dpb;
  $('vDpb').textContent = state.dpb;
  $('fname').value = state.name;
  $('vName').textContent = state.name;
  $('worldPath').value = state.worldPath || '';
  nameHint();
  setZoom(state.zoom || 1);
  restoreDir();
  render();
})();
</script>
</body>
</html>
